name: Temporary neutral registry regeneration for #82

on:
  push:
    branches:
      - polyphemus-project-rule-evidence-82

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message == 'Admit Polyphemus neutral project-rule evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate neutral registry
        run: python system-observations/render_registry.py
      - name: Commit generated registry views
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add system-observations/registry.psv system-observations/REGISTRY.md
          if git diff --cached --quiet; then
            echo 'Registry already current.'
          else
            git commit -m 'Regenerate neutral observation registry for #82'
            git push
          fi
