name: normalize migrated active layer

on:
  push:
    branches:
      - bootstrap/experimental-capability

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/experimental-capability
          fetch-depth: 0

      - name: Normalize active migrated artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          # Active path ownership changed during extraction from Index.
          path_replacements = {
              'vsm-benchmark-family-map/': '../vsm-projections/benchmark-family-map/',
              's1-system-benchmarks/': '../vsm-projections/s1/',
              's2-system-benchmarks/': '../vsm-projections/s2/',
              's3-system-benchmarks/': '../vsm-projections/s3/',
              's3star-system-benchmarks/': '../vsm-projections/s3star/',
              's4-system-benchmarks/': '../vsm-projections/s4/',
              's5-system-benchmarks/': '../vsm-projections/s5/',
          }
          for rel in ['baselines/FUNCTION-BASELINES.md', 'baselines/PRIMARY-BASELINES.md']:
              p = Path(rel)
              text = p.read_text()
              for old, new in path_replacements.items():
                  text = text.replace(old, new)
              p.write_text(text)

          p = Path('frontier/EVIDENCE-FRONTIER.md')
          text = p.read_text()
          text = text.replace('`SYNTHESIS.md` and `experiment-state.json`', '`historical/predecessor/SYNTHESIS.md` and `historical/predecessor/experiment-state.json`')
          text = text.replace('(primary-baselines.json)', '(../baselines/primary-baselines.json)')
          for old, new in {
              's2-system-benchmarks/': '../vsm-projections/s2/',
              's3-system-benchmarks/': '../vsm-projections/s3/',
              's3star-system-benchmarks/': '../vsm-projections/s3star/',
              's4-system-benchmarks/': '../vsm-projections/s4/',
              's5-system-benchmarks/': '../vsm-projections/s5/',
          }.items():
              text = text.replace(old, new)
          text = text.replace('historical SYNTHESIS.md / experiment-state.json', 'historical/predecessor/SYNTHESIS.md / historical/predecessor/experiment-state.json')
          text = text.replace('current primary-baselines.json', 'current baselines/primary-baselines.json')
          p.write_text(text)

          # Domain-specific derived assessment no longer belongs to the active general layer.
          p = Path('baselines/primary-baselines.json')
          data = json.loads(p.read_text())
          data['functions']['S1'].pop('domains', None)
          data['raw_metric_rule'] = 'Do not duplicate numeric benchmark results in this selection record. Store each result once in system-observations/ and reference it from VSM-function/general-capability views.'
          data['replacement_rule'] = 'A stronger general-capability primary may replace a selected primary without deleting historical observations. Specialized-domain evidence remains raw provenance unless a separate domain-specific repository consumes it.'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          # Rewrite active rationale so predecessor domain projections and operated-run language
          # do not survive as current repository policy.
          p = Path('baselines/PRIMARY-BASELINES.md')
          text = p.read_text()
          text = text.replace('used by the `functional-capability-depth` experiment', 'used by the extracted `vsm-harness-capability` experiment')
          text = text.replace('6. **scope-honest** — narrow applied-domain results remain domain projections rather than universal capability claims.', '6. **scope-honest** — specialized-domain results remain explicitly scoped evidence and do not become general capability claims without independent support for transfer/generality.')
          start = text.find('## Applied-domain projections')
          end = text.find('## Ownership and boundary rule')
          if start != -1 and end != -1 and end > start:
              replacement = '''## Specialized-domain evidence boundary\n\nRaw observations may record factual task or operating-domain context, including Coding/SWE, science, cybersecurity, browser use, infrastructure, or other specialized environments.\n\nThat context is provenance, not a domain-specific assessment owned by this repository.\n\n```text\nspecialized-domain observation\n        ≠ automatically\ngeneral functional-capability claim\n```\n\nA specialized result may support a general claim only when transfer/generality is independently supported. Future domain-specific repositories perform fresh assessments under their own system boundary, autonomy requirements, evidence contract and capability requirements.\n\n'''
              text = text[:start] + replacement + text[end:]
          text = text.replace('Opensiro does not need to operate every benchmark itself.\n\nThe default capability path is:', 'OpenSiro does not run or reproduce benchmark experiments on assessed harnesses to create capability evidence for this repository.\n\nThe active capability path is:')
          text = text.replace('\nOpensiro-operated runs are optional reproduction or validation evidence, not a prerequisite for capability ingestion.\n', '\nA public-evidence gap remains a gap until suitable upstream or third-party evidence exists. Controlled execution from the predecessor experiment is historical research only.\n')
          text = text.replace('secondary/domain evidence', 'secondary evidence')
          text = text.replace('function/domain projections', 'VSM-function/general-capability views')
          p.write_text(text)

          # The active S1 baseline contains only the general primary. Specialized tables remain
          # recoverable in predecessor history and raw observations, not as current domain grades.
          Path('baselines/S1-BASELINE.md').write_text('''# S1 General Capability Baseline\n\nStatus: **experimental, non-normative**\n\nThis is the current selected **general** S1 comparison cell. It is not a global harness ranking and does not change canonical VSM ownership. Rows are ordered by harness ID, never by score.\n\n## Function baseline availability\n\n| Function | Status | Primary family | Reference model |\n| --- | --- | --- | --- |\n| S1 | `selected` | PawBench v1.0 | `qwen3.6-35b-a3b` |\n| S2 | `gap` | — | — |\n| S3 | `gap` | — | — |\n| S3* | `gap` | — | — |\n| S4 | `gap` | — | — |\n| S5 | `gap` | — | — |\n\nA `gap` means no materially matched canonical-harness general-capability primary has been selected for that function. It is not a zero score and does not mean relevant public evidence is absent.\n\n## S1 selected general primary\n\n**PawBench v1.0** · model `qwen3.6-35b-a3b` · comparison `matched-model-cross-harness`\n\n| Harness | Canonical S1 | Historical benchmark identity | Result | Compatibility |\n| --- | --- | --- | ---: | --- |\n| Hermes Agent (`hermes-agent`) | `A` | `2026.4.23` · version-known | `0.5674` | `adapter-preserved` |\n| OpenClaw (`openclaw`) | `A` | `2026.4.24` · version-known | `0.6779` | `adapter-preserved` |\n| QwenPaw (`qwenpaw`) | `A` | `1.1.3` · version-known | `0.6828` | `adapter-preserved` |\n\nThe raw numeric results remain owned by `system-observations/`; this file is a derived comparison view. Historical benchmark identity must not be relabelled as the current canonical Index revision.\n\n## Specialized-domain evidence\n\nThe raw registry also contains evidence from specialized environments such as software engineering. Those observations remain available as provenance/evidence, but this repository does not publish a Coding/SWE capability grade or domain-specific primary.\n\nA specialized-domain repository may later consume those observations and perform a fresh assessment under its own domain contract.\n\n## Reading rule\n\n```text\ncanonical VSM state\n        ≠\ngeneral functional capability\n        ≠\ndomain-specific assessment\n```\n\nDo not average PawBench with unrelated benchmark families into one S1 or overall harness score. Adaptive/self-organizing evidence remains a separate evidence class.\n''')

          # Make the active generated cross-function view use the extracted paths and terminology.
          p = Path('baselines/FUNCTION-BASELINES.md')
          text = p.read_text()
          text = text.replace('secondary evidence and domain projections', 'secondary evidence with explicit scope/provenance')
          p.write_text(text)
          PY

      - name: Strengthen repository validation
        shell: bash
        run: |
          cat > scripts/validate_repository.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import json
          import subprocess
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          REQUIRED = [
              'README.md', 'CONTRACT.md', 'PUBLIC-EVIDENCE.md', 'EVIDENCE-REGISTRY.md',
              'BASELINE.md', 'MIGRATION.md', 'system-observations/README.md',
              'vsm-projections/README.md', 'comparison-cells/README.md', 'baselines/README.md',
              'frontier/README.md', 'historical/README.md',
          ]
          errors = []
          for rel in REQUIRED:
              if not (ROOT / rel).is_file():
                  errors.append(f'missing required file: {rel}')

          for rel in ('README.md', 'CONTRACT.md', 'PUBLIC-EVIDENCE.md', 'BASELINE.md'):
              path = ROOT / rel
              if path.is_file() and 'experimental' not in path.read_text(encoding='utf-8').lower():
                  errors.append(f'{rel}: must explicitly state experimental status')

          contract = (ROOT / 'CONTRACT.md').read_text(encoding='utf-8') if (ROOT / 'CONTRACT.md').is_file() else ''
          for phrase in (
              'general functional capability', 'domain-specific assessment', 'vsm-harness-profile',
              'vsm-harness-index', 'does not run or reproduce benchmark experiments',
          ):
              if phrase.lower() not in contract.lower():
                  errors.append(f'CONTRACT.md: missing contract phrase: {phrase}')

          if (ROOT / 'domain-projections').exists():
              errors.append('domain-projections/: domain-specific assessment is outside this repository boundary')

          active_files = [
              ROOT / 'baselines' / 'FUNCTION-BASELINES.md',
              ROOT / 'baselines' / 'PRIMARY-BASELINES.md',
              ROOT / 'baselines' / 'S1-BASELINE.md',
              ROOT / 'frontier' / 'EVIDENCE-FRONTIER.md',
          ]
          forbidden = {
              'domain_projection': 'active general layer must not own domain-specific projection state',
              '## Applied-domain projections': 'active general layer must not publish domain-specific projection sections',
              'Opensiro-operated runs are optional': 'active evidence contract forbids operated runs as evidence admission',
              's2-system-benchmarks/': 'old Index-local path leaked into active extracted view',
              's3-system-benchmarks/': 'old Index-local path leaked into active extracted view',
              's3star-system-benchmarks/': 'old Index-local path leaked into active extracted view',
              's4-system-benchmarks/': 'old Index-local path leaked into active extracted view',
              's5-system-benchmarks/': 'old Index-local path leaked into active extracted view',
          }
          for path in active_files:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              for needle, why in forbidden.items():
                  if needle in text:
                      errors.append(f'{path.relative_to(ROOT)}: {why}: {needle}')

          selection_path = ROOT / 'baselines' / 'primary-baselines.json'
          if selection_path.is_file():
              data = json.loads(selection_path.read_text(encoding='utf-8'))
              if 'domains' in data.get('functions', {}).get('S1', {}):
                  errors.append('baselines/primary-baselines.json: domain-specific derived state remains in active general layer')

          registry = ROOT / 'system-observations' / 'registry.psv'
          if registry.is_file():
              rows = [line for line in registry.read_text(encoding='utf-8').splitlines()[1:] if line.strip()]
              ids = [line.split('|', 1)[0] for line in rows]
              if len(ids) != 53 or len(set(ids)) != 53:
                  errors.append(f'system-observations/registry.psv: expected 53 unique migrated observation IDs, got {len(set(ids))}/{len(ids)}')

          for cmd in (
              [sys.executable, str(ROOT / 'system-observations' / 'validate.py')],
              [sys.executable, str(ROOT / 'system-observations' / 'render_registry.py'), '--check'],
          ):
              if Path(cmd[1]).is_file():
                  result = subprocess.run(cmd, cwd=ROOT, text=True, capture_output=True)
                  if result.returncode:
                      errors.append(f"{' '.join(cmd)} failed:\n{result.stdout}{result.stderr}")

          if errors:
              print('repository validation failed:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)
          print('repository validation passed')
          PY

      - name: Validate normalized repository
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          git diff --check

      - name: Commit normalization and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/normalize-active-layer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: align active capability layer with general scope'
          git push origin HEAD:bootstrap/experimental-capability
