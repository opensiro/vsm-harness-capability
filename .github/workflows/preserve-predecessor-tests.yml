name: preserve predecessor capability tests

on:
  push:
    branches:
      - chore/preserve-predecessor-tests

permissions:
  contents: write

jobs:
  preserve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/preserve-predecessor-tests
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Copy predecessor experiment-specific tests
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF='3446fe77e031878dc8ad4edfb857b608a7a6b26f'
          git clone --quiet https://github.com/opensiro/vsm-harness-index.git /tmp/index
          git -C /tmp/index checkout --quiet "$SOURCE_REF"

          rm -rf historical/predecessor-tests
          mkdir -p historical/predecessor-tests
          mapfile -t files < <(git -C /tmp/index grep -l 'functional-capability-depth' "$SOURCE_REF" -- 'tests/*.py' | sed 's/^[^:]*://')
          if (( ${#files[@]} == 0 )); then
            echo 'no predecessor capability tests found' >&2
            exit 1
          fi
          for rel in "${files[@]}"; do
            cp "/tmp/index/$rel" "historical/predecessor-tests/$(basename "$rel")"
          done

          {
            echo '# Predecessor experiment-specific tests'
            echo
            echo 'Status: **historical / non-active**'
            echo
            echo "These tests were copied byte-for-byte from \`opensiro/vsm-harness-index@$SOURCE_REF\` because they exercised the former \`experiments/functional-capability-depth\` surface outside the experiment directory itself."
            echo
            echo 'They are preserved for provenance and reconstruction. They are **not** active Capability CI because they encode predecessor Index-local paths, local canonical-assessment assumptions, and historical migration assertions.'
            echo
            echo 'Current active repository validation is owned by `scripts/validate_repository.py` and the validators attached to current Capability-owned artifacts.'
            echo
            echo "Preserved test files: **${#files[@]}**"
          } > historical/predecessor-tests/README.md

          (cd historical/predecessor-tests && sha256sum test_*.py | sort) > historical/predecessor-tests/SHA256SUMS.txt

          python - <<'PY'
          from pathlib import Path
          p = Path('historical/README.md')
          text = p.read_text()
          addition = '\n- `predecessor-tests/` preserves experiment-specific Index tests that lived outside the predecessor experiment subtree. They are historical, not active Capability CI.\n'
          if 'predecessor-tests/' not in text:
              text = text.rstrip() + '\n' + addition
          p.write_text(text)
          PY

      - name: Verify byte identity and active contract
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF='3446fe77e031878dc8ad4edfb857b608a7a6b26f'
          mapfile -t source_files < <(git -C /tmp/index grep -l 'functional-capability-depth' "$SOURCE_REF" -- 'tests/*.py' | sed 's/^[^:]*://')
          test_count=$(find historical/predecessor-tests -maxdepth 1 -name 'test_*.py' -type f | wc -l)
          [[ "$test_count" -eq "${#source_files[@]}" ]]
          for rel in "${source_files[@]}"; do
            cmp "/tmp/index/$rel" "historical/predecessor-tests/$(basename "$rel")"
          done
          python scripts/validate_repository.py
          git diff --check

      - name: Commit preserved test history and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/preserve-predecessor-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'history: preserve predecessor capability tests'
          git push origin HEAD:chore/preserve-predecessor-tests
