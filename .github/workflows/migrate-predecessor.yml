name: migrate predecessor experiment

on:
  push:
    branches:
      - bootstrap/experimental-capability

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout capability repository
        uses: actions/checkout@v4
        with:
          ref: bootstrap/experimental-capability
          fetch-depth: 0

      - name: Checkout pinned predecessor
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/opensiro/vsm-harness-index.git _source
          git -C _source checkout 3446fe77e031878dc8ad4edfb857b608a7a6b26f
          test "$(git -C _source rev-parse HEAD)" = "3446fe77e031878dc8ad4edfb857b608a7a6b26f"

      - name: Import active neutral observations
        shell: bash
        run: |
          set -euo pipefail
          src=_source/experiments/functional-capability-depth
          mkdir -p system-observations
          cp "$src"/system-observations/*.json system-observations/
          cp "$src"/system-observations/registry.psv system-observations/
          cp "$src"/system-observations/REGISTRY.md system-observations/
          cp "$src"/system-observations/render_registry.py system-observations/
          cp "$src"/system-observations/render_registry_core.py system-observations/
          if test -f "$src"/system-observations/validate.py; then
            cp "$src"/system-observations/validate.py system-observations/
          fi

      - name: Import derived VSM projections
        shell: bash
        run: |
          set -euo pipefail
          src=_source/experiments/functional-capability-depth
          for spec in \
            s1-system-benchmarks:s1 \
            s2-system-benchmarks:s2 \
            s3-system-benchmarks:s3 \
            s3star-system-benchmarks:s3star \
            s4-system-benchmarks:s4 \
            s5-system-benchmarks:s5 \
            vsm-benchmark-family-map:benchmark-family-map
          do
            old="${spec%%:*}"
            new="${spec##*:}"
            mkdir -p "vsm-projections/$new"
            cp -a "$src/$old/." "vsm-projections/$new/"
          done

      - name: Import current baseline and frontier state
        shell: bash
        run: |
          set -euo pipefail
          src=_source/experiments/functional-capability-depth
          mkdir -p baselines frontier
          cp "$src"/PRIMARY-BASELINES.md baselines/
          cp "$src"/FUNCTION-BASELINES.md baselines/
          cp "$src"/S1-BASELINE.md baselines/
          cp "$src"/primary-baselines.json baselines/
          cp "$src"/EVIDENCE-FRONTIER.md frontier/

      - name: Preserve frozen predecessor history
        shell: bash
        run: |
          set -euo pipefail
          src=_source/experiments/functional-capability-depth
          mkdir -p historical/predecessor historical/predecessor-tooling
          cp -a "$src"/batch-01 historical/predecessor/
          cp -a "$src"/batch-02 historical/predecessor/
          cp "$src"/SYNTHESIS.md historical/predecessor/
          cp "$src"/experiment-state.json historical/predecessor/
          cp "$src"/NOTE.md historical/predecessor/PREDECESSOR-NOTE.md
          cp "$src"/render_evidence_frontier.py historical/predecessor-tooling/
          cp "$src"/render_function_baselines.py historical/predecessor-tooling/
          cp "$src"/render_s1_baseline.py historical/predecessor-tooling/
          cp "$src"/validate_synthesis.py historical/predecessor-tooling/
          printf '%s\n' 'opensiro/vsm-harness-index@3446fe77e031878dc8ad4edfb857b608a7a6b26f' > historical/SOURCE-REF
          (
            cd "$src"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$GITHUB_WORKSPACE/historical/PREDECESSOR-SHA256SUMS.txt"

      - name: Rebase imported links onto the new layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '../system-observations/': '../../system-observations/',
              '../PUBLIC-EVIDENCE.md': '../../PUBLIC-EVIDENCE.md',
              '../BENCHMARK-SYSTEM-REGISTRY.md': '../../EVIDENCE-REGISTRY.md',
              '../PRIMARY-BASELINES.md': '../../baselines/PRIMARY-BASELINES.md',
              '../FUNCTION-BASELINES.md': '../../baselines/FUNCTION-BASELINES.md',
              '../S1-BASELINE.md': '../../baselines/S1-BASELINE.md',
              '../EVIDENCE-FRONTIER.md': '../../frontier/EVIDENCE-FRONTIER.md',
          }
          root = Path('vsm-projections')
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.md', '.json', '.py', '.psv', '.txt'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify lossless raw observation import
        shell: bash
        run: |
          set -euo pipefail
          src=_source/experiments/functional-capability-depth/system-observations
          source_count="$(find "$src" -maxdepth 1 -name '*.json' -type f | wc -l | tr -d ' ')"
          target_count="$(find system-observations -maxdepth 1 -name '*.json' -type f | wc -l | tr -d ' ')"
          echo "source raw JSON files: $source_count"
          echo "target raw JSON files: $target_count"
          test "$source_count" = "$target_count"
          for file in "$src"/*.json; do
            cmp "$file" "system-observations/$(basename "$file")"
          done
          test "$(awk 'NR>1 {print $1}' system-observations/registry.psv | sort -u | wc -l | tr -d ' ')" = "53"

      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          git diff --check

      - name: Commit migrated snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _source
          rm -f .github/workflows/migrate-predecessor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'migration: import capability experiment from Index'
          git push origin HEAD:bootstrap/experimental-capability
