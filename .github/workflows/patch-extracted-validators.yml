name: patch extracted validators

on:
  push:
    branches:
      - bootstrap/experimental-capability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/experimental-capability
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch cross-repository extraction assumptions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          validators = [
              root / 'vsm-projections' / name / 'validate.py'
              for name in ('s2', 's3', 's3star', 's4', 's5')
          ]

          external_assessment = '''def assessment_fields(harness_id: str) -> dict[str, str]:
              cache = getattr(assessment_fields, "_cache", {})
              if harness_id in cache:
                  return cache[harness_id]
              from urllib.error import HTTPError, URLError
              from urllib.request import urlopen
              url = (
                  "https://raw.githubusercontent.com/opensiro/vsm-harness-index/"
                  f"main/assessments/{harness_id}.md"
              )
              try:
                  with urlopen(url, timeout=20) as response:
                      text = response.read().decode("utf-8")
              except (HTTPError, URLError, TimeoutError) as exc:
                  fail(f"cannot resolve canonical Index assessment for {harness_id}: {exc}")
              marker = "---" + chr(10)
              if not text.startswith(marker):
                  fail(f"canonical Index assessment for {harness_id} has no front matter")
              try:
                  frontmatter = text.split(marker, 2)[1]
              except IndexError:
                  fail(f"canonical Index assessment for {harness_id} has malformed front matter")
              fields: dict[str, str] = {}
              for line in frontmatter.splitlines():
                  if ":" not in line:
                      continue
                  key, value = line.split(":", 1)
                  fields[key.strip()] = value.strip()
              cache[harness_id] = fields
              assessment_fields._cache = cache
              return fields
          '''
          external_assessment = re.sub(r'^ {12}', '', external_assessment, flags=re.M)

          for path in validators:
              text = path.read_text(encoding='utf-8')
              text = text.replace('ROOT = HERE.parents[2]', 'ROOT = HERE.parents[1]')
              text = text.replace('HERE.parent / "system-observations"', 'ROOT / "system-observations"')
              text = text.replace('HERE.parent/"system-observations"', 'ROOT / "system-observations"')
              text = text.replace('HERE.parent / "vsm-benchmark-family-map"', 'HERE.parent / "benchmark-family-map"')
              text = text.replace('HERE.parent/"vsm-benchmark-family-map"', 'HERE.parent / "benchmark-family-map"')

              pattern = re.compile(
                  r'def assessment_fields\(harness_id: str\) -> dict\[str, str\]:\n.*?(?=\ndef [A-Za-z_])',
                  re.S,
              )
              if pattern.search(text):
                  text = pattern.sub(external_assessment.rstrip() + '\n', text, count=1)
              path.write_text(text, encoding='utf-8')

          for path in (root / 'vsm-projections').rglob('*'):
              if not path.is_file() or path.suffix not in {'.json', '.jsonl'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace(
                  '"raw_observation_ref":"../system-observations/',
                  '"raw_observation_ref":"../../system-observations/',
              ).replace(
                  '"raw_observation_ref": "../system-observations/',
                  '"raw_observation_ref": "../../system-observations/',
              ).replace(
                  '"raw_record":"../system-observations/',
                  '"raw_record":"../../system-observations/',
              ).replace(
                  '"raw_record": "../system-observations/',
                  '"raw_record": "../../system-observations/',
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Compile patched validators
        run: python -m py_compile vsm-projections/{s2,s3,s3star,s4,s5}/validate.py

      - name: Commit extraction adapter
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-extracted-validators.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No extraction patches needed.'
            exit 0
          fi
          git commit -m 'fix: adapt derived validators to extracted repository'
          git push origin HEAD:bootstrap/experimental-capability
