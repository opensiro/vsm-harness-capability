name: _tmp regenerate neutral registry 79

on:
  push:
    branches:
      - platypus-context-evidence-79

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: platypus-context-evidence-79
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate neutral registry
        run: python system-observations/render_registry.py
      - name: Commit generated views if changed
        run: |
          if git diff --quiet -- system-observations/registry.psv system-observations/REGISTRY.md; then
            echo "Registry already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system-observations/registry.psv system-observations/REGISTRY.md
          git commit -m "Regenerate neutral observation registry"
          git push origin HEAD:platypus-context-evidence-79
