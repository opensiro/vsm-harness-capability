name: tmp-regenerate-neutral-registry-76

on:
  push:
    branches:
      - bernstein-governance-evidence-76

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bernstein-governance-evidence-76
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render neutral registry
        run: python system-observations/render_registry.py
      - name: Commit generated views
        run: |
          if git diff --quiet -- system-observations/registry.psv system-observations/REGISTRY.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system-observations/registry.psv system-observations/REGISTRY.md
          git commit -m "Regenerate neutral registry for Bernstein (#76)"
          git push origin HEAD:bernstein-governance-evidence-76
