name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_repository.py
      - name: Validate Capability-native post-closure contract
        run: python vsm-projections/benchmark-family-map/validate_post_closure.py
      - name: Validate specialized AHO post-closure evidence
        run: python vsm-projections/s4/post-closure-deltas/validate.py
      - name: Admission — Cursor GPT-5.6 release
        run: python scripts/admission_check.py system-observations/cursor-openbench-gpt56-release15-external-reproduced-adapter-preserved.json
      - name: Admission — GrokBuild GPT-5.6 release
        run: python scripts/admission_check.py system-observations/grokbuild-openbench-gpt56-release15-external-reproduced-adapter-preserved.json
      - name: Admission — Devin GPT-5.6 release
        run: python scripts/admission_check.py system-observations/devin-openbench-gpt56-release15-external-reproduced-adapter-preserved.json
      - name: Admission — Claude GPT-5.6 release
        run: python scripts/admission_check.py system-observations/claude-openbench-gpt56-release15-external-reproduced-adapter-preserved.json
      - name: Admission — OpenCode GPT-5.6 release
        run: python scripts/admission_check.py system-observations/opencode-openbench-gpt56-release15-external-reproduced-adapter-preserved.json
      - name: Admission — Pi GPT-5.6 release
        run: python scripts/admission_check.py system-observations/pi-openbench-gpt56-release15-external-reproduced-adapter-preserved.json
      - name: Admission — Codex GPT-5.6 release
        run: python scripts/admission_check.py system-observations/codex-openbench-gpt56-release15-external-reproduced-adapter-preserved.json
      - name: Exercise existing live evidence admission path
        run: |
          for record in \
            system-observations/claude-code-wildclawbench-external-reproduced-adapter-preserved.json \
            system-observations/codex-wildclawbench-external-reproduced-adapter-preserved.json \
            system-observations/hermes-agent-wildclawbench-external-reproduced-adapter-preserved.json \
            system-observations/openclaw-wildclawbench-external-reproduced-adapter-preserved.json \
            system-observations/skillrevise.json
          do
            python scripts/admission_check.py "$record"
          done
