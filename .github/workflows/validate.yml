name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate neutral registry views
        run: python system-observations/render_registry.py
      - name: Commit generated registry views on PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add system-observations/registry.psv system-observations/REGISTRY.md
          if ! git diff --cached --quiet; then
            git commit -m "regenerate neutral observation registry"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: python scripts/validate_repository.py
      - name: Validate Capability-native post-closure contract
        run: python vsm-projections/benchmark-family-map/validate_post_closure.py
      - name: Validate specialized AHO post-closure evidence
        run: python vsm-projections/s4/post-closure-deltas/validate.py
      - name: Admission — Cursor Grok45 release
        run: python scripts/admission_check.py system-observations/cursor-openbench-grok45-release15-external-reproduced-adapter-preserved.json
      - name: Admission — GrokBuild Grok45 release
        run: python scripts/admission_check.py system-observations/grokbuild-openbench-grok45-release15-external-reproduced-adapter-preserved.json
      - name: Admission — Pi Grok45 release
        run: python scripts/admission_check.py system-observations/pi-openbench-grok45-release15-external-reproduced-adapter-preserved.json
      - name: Admission — OpenCode Grok45 release
        run: python scripts/admission_check.py system-observations/opencode-openbench-grok45-release15-external-reproduced-adapter-preserved.json
      - name: Exercise existing live evidence admission path
        run: |
          for record in \
            system-observations/claude-code-wildclawbench-external-reproduced-adapter-preserved.json \
            system-observations/codex-wildclawbench-external-reproduced-adapter-preserved.json \
            system-observations/hermes-agent-wildclawbench-external-reproduced-adapter-preserved.json \
            system-observations/openclaw-wildclawbench-external-reproduced-adapter-preserved.json \
            system-observations/skillrevise.json
          do
            python scripts/admission_check.py "$record"
          done
