name: post-bootstrap extraction repair

on:
  push:
    branches:
      - fix/post-bootstrap-extraction

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-bootstrap-extraction
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replay validated post-bootstrap extraction fixes
        shell: bash
        run: |
          set -euo pipefail
          ref=ce43b13cdbdadf83c0ba6aea61dc30c0bd9777f7
          base="https://raw.githubusercontent.com/opensiro/vsm-harness-capability/${ref}"
          for path in \
            scripts/validate_repository.py \
            vsm-projections/benchmark-family-map/validate.py \
            vsm-projections/s1/observations.jsonl \
            vsm-projections/s1/validate.py \
            vsm-projections/s2/validate.py \
            vsm-projections/s3/validate.py \
            vsm-projections/s3star/validate.py \
            vsm-projections/s4/validate.py \
            vsm-projections/s5/validate.py
          do
            curl -fsSL "$base/$path" -o "$path"
          done

          python - <<'PY'
          from pathlib import Path
          for path in Path('vsm-projections').rglob('*'):
              if not path.is_file() or path.suffix not in {'.json', '.jsonl'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace(
                  '"raw_observation_ref":"../system-observations/',
                  '"raw_observation_ref":"../../system-observations/',
              ).replace(
                  '"raw_observation_ref": "../system-observations/',
                  '"raw_observation_ref": "../../system-observations/',
              ).replace(
                  '"raw_record":"../system-observations/',
                  '"raw_record":"../../system-observations/',
              ).replace(
                  '"raw_record": "../system-observations/',
                  '"raw_record": "../../system-observations/',
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate extracted corpus
        shell: bash
        run: |
          set -euo pipefail
          python system-observations/render_registry.py --check
          python system-observations/validate.py
          python vsm-projections/benchmark-family-map/validate.py
          python vsm-projections/s1/validate.py
          python vsm-projections/s2/validate.py
          python vsm-projections/s3/validate.py
          python vsm-projections/s3star/validate.py
          python vsm-projections/s4/validate.py
          python vsm-projections/s5/validate.py
          python scripts/validate_repository.py
          git diff --check

      - name: Commit repaired current-main state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/post-bootstrap-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No post-bootstrap fixes needed.'
            exit 0
          fi
          git commit -m 'fix: complete extracted capability validation'
          git push origin HEAD:fix/post-bootstrap-extraction
